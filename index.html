<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>ACV · Word as a Playable System</title>
    <meta name="description" content="Interactive 2D playable typographic system for ACV (Agnostic Consulting Value)." />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app-container">
      <!-- Minimalist top indicator -->
      <header id="top-indicator">
        <span class="brand-monogram">ACV</span>
        <div class="stage-pills">
          <span class="stage-pill active" id="pill-A">A</span>
          <span class="stage-pill" id="pill-C">C</span>
          <span class="stage-pill" id="pill-V">V</span>
        </div>
      </header>

      <!-- Main Playable Canvas Wrapper -->
      <main id="canvas-wrapper"></main>

      <!-- Minimalist Next Stage Button -->
      <button id="next-stage-btn" aria-label="Next Stage">
        <span>STAGE C</span>
        <span>→</span>
      </button>

      <!-- Smooth Scene Transition Curtain -->
      <div id="transition-curtain"></div>
    </div>

    <!-- Main Game Orchestrator -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
